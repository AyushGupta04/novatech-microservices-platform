server:
  port: 0

spring:
  application:
    name: order-service-test
  datasource:
    url: jdbc:h2:mem:order_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

services:
  product:
    url: http://localhost:8082
  inventory:
    url: http://localhost:8083
  cart:
    url: http://localhost:8084

jwt:
  secret: EnterpriseEcommerceSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!
  expiration-ms: 3600000
