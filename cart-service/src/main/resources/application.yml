server:
  port: 8084

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:EnterpriseEcommerceSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
